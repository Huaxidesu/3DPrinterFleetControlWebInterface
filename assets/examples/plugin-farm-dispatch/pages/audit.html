<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>审核 · 农场派单</title>
  <style>
    :root {
      --bg: #f4f6f8; --card: #fff; --line: #dde3ea; --text: #1b2430;
      --muted: #6b7a8d; --acc: #2563eb; --ok: #059669; --err: #dc2626; --warn: #d97706;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      background: linear-gradient(180deg, #e8eef5 0%, var(--bg) 240px);
      color: var(--text); min-height: 100vh;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 48px; }
    h1 { margin: 0 0 6px; font-size: 1.6rem; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin-bottom: 20px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 16px 18px; margin-bottom: 12px; box-shadow: 0 1px 0 rgba(16,24,40,.04);
    }
    .row { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 16px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .badge {
      display: inline-block; font-size: 12px; font-weight: 650; padding: 3px 8px;
      border-radius: 999px; background: #eef2ff; color: #3730a3;
    }
    .b-pending { background: #fff7ed; color: #9a3412; }
    .b-wait { background: #fef3c7; color: #92400e; }
    .b-print { background: #ecfdf5; color: #065f46; }
    .b-rej { background: #fef2f2; color: #991b1b; }
    button {
      appearance: none; border: 0; border-radius: 8px; padding: 9px 14px;
      font-weight: 600; cursor: pointer; background: var(--acc); color: #fff; font-size: 14px;
    }
    button.ghost { background: #fff; color: var(--text); border: 1px solid var(--line); }
    button.ok { background: var(--ok); }
    button.danger { background: var(--err); }
    input, textarea, select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
      font-size: 14px; margin: 6px 0 12px;
    }
    textarea { min-height: 80px; resize: vertical; }
    .meta { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .login { max-width: 400px; margin: 12vh auto; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab { background: #fff; border: 1px solid var(--line); color: var(--muted); }
    .tab.on { border-color: var(--acc); color: var(--acc); }
    .empty { text-align: center; color: var(--muted); padding: 40px; }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <script>
(function () {
  var TOKEN_KEY = 'farm_dispatch_jwt_audit'

  function $(id) { return document.getElementById(id) }
  function token() { return localStorage.getItem(TOKEN_KEY) || '' }
  function setToken(t) { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY) }
  function unwrap(j) {
    if (j && j.data && typeof j.data === 'object' && (j.ok === true || j.data.ok != null || j.data.jobs || j.data.roles)) return j.data
    return j
  }
  async function api(method, path, body) {
    var headers = { Accept: 'application/json' }
    if (token()) headers.Authorization = 'Bearer ' + token()
    if (body != null) headers['Content-Type'] = 'application/json'
    var res = await fetch(path, { method: method, headers: headers, body: body != null ? JSON.stringify(body) : undefined })
    var j = unwrap(await res.json().catch(function () { return { ok: false } }))
    return j
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }
  function statusBadge(s) {
    var map = {
      pending_audit: ['待审核', 'b-pending'],
      approved: ['已通过', ''],
      waiting_material: ['等换料', 'b-wait'],
      printing: ['已派打', 'b-print'],
      rejected: ['已驳回', 'b-rej'],
      failed: ['派单失败', 'b-rej']
    }
    var m = map[s] || [s, '']
    return '<span class="badge ' + m[1] + '">' + m[0] + '</span>'
  }

  var state = { me: null, jobs: [], tab: 'pending_audit', selected: null }

  async function login(u, p) {
    var res = await fetch('/api/v1/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    })
    var j = await res.json()
    if (!j.token) throw new Error(j.message || '登录失败')
    setToken(j.token)
    var me = await api('GET', '/api/v1/farm-dispatch/me')
    if (!me.ok || !me.roles || !me.roles.audit) {
      setToken('')
      throw new Error('该账号不是审核岗，请加入「审核」用户组')
    }
    return me
  }

  function renderLogin() {
    $('app').innerHTML =
      '<div class="card login"><h1>审核台登录</h1><div class="sub">仅「审核」用户组可进入</div>' +
      '<label>账号</label><input id="u" /><label>密码</label><input id="p" type="password" />' +
      '<button id="go" style="width:100%">登录</button></div>'
    $('go').onclick = async function () {
      try {
        state.me = await login($('u').value.trim(), $('p').value)
        await refresh()
      } catch (e) { alert(e.message || e) }
    }
  }

  function render() {
    if (!state.me) return renderLogin()
    var tabs = [
      ['pending_audit', '待审核'],
      ['waiting_material', '等换料'],
      ['printing', '已派打'],
      ['rejected', '已驳回'],
      ['', '全部']
    ]
    $('app').innerHTML =
      '<div class="row"><div><h1>派单审核</h1><div class="sub">' +
      esc(state.me.user.displayName || state.me.user.username) +
      ' · PC 审核通过后按机型/材料/颜色智能派单</div></div>' +
      '<div><button class="ghost" id="reload">刷新</button> <button class="ghost" id="out">退出</button></div></div>' +
      '<div class="tabs">' + tabs.map(function (t) {
        return '<button class="tab' + (state.tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>'
      }).join('') + '</div>' +
      '<div class="grid"><div id="list"></div><div id="detail"></div></div>'
    $('out').onclick = function () { setToken(''); state.me = null; renderLogin() }
    $('reload').onclick = refresh
    Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (el) {
      el.onclick = function () { state.tab = el.getAttribute('data-tab'); renderList(); renderDetail() }
    })
    renderList()
    renderDetail()
  }

  function filtered() {
    if (!state.tab) return state.jobs
    return state.jobs.filter(function (j) { return j.status === state.tab })
  }

  function renderList() {
    var list = filtered()
    var el = $('list')
    if (!list.length) { el.innerHTML = '<div class="card empty">暂无任务</div>'; return }
    el.innerHTML = list.map(function (j) {
      return '<div class="card" data-id="' + j.id + '" style="cursor:pointer' +
        (state.selected && state.selected.id === j.id ? ';outline:2px solid #2563eb' : '') + '">' +
        '<div class="row"><strong>' + esc(j.filename) + '</strong>' + statusBadge(j.status) + '</div>' +
        '<div class="meta">申请人 ' + esc(j.applicantName) + ' · ' + esc(j.createdAt) +
        '<br>机型 ' + esc(j.model) + ' · ' + esc(j.material) + ' · ' + esc(j.color || j.colorHex) +
        (j.rejectReason ? '<br><span style="color:#dc2626">驳回：' + esc(j.rejectReason) + '</span>' : '') +
        (j.waitReason ? '<br><span style="color:#d97706">' + esc(j.waitReason) + '</span>' : '') +
        '</div></div>'
    }).join('')
    Array.prototype.forEach.call(el.querySelectorAll('[data-id]'), function (c) {
      c.onclick = function () {
        state.selected = state.jobs.find(function (x) { return x.id === c.getAttribute('data-id') })
        renderList(); renderDetail()
      }
    })
  }

  function renderDetail() {
    var el = $('detail')
    var j = state.selected
    if (!j) { el.innerHTML = '<div class="card empty">选择左侧任务</div>'; return }
    el.innerHTML =
      '<div class="card"><h2 style="margin:0 0 8px;font-size:1.1rem">任务详情</h2>' +
      '<div class="meta">ID ' + esc(j.id) + '<br>状态 ' + statusBadge(j.status) +
      '<br>文件 ' + esc(j.filename) +
      '<br>机型 ' + esc(j.model) + ' / 材料 ' + esc(j.material) + ' / 颜色 ' + esc(j.color || j.colorHex) +
      '<br>申请人 ' + esc(j.applicantName) +
      (j.deviceName ? '<br>已派设备 ' + esc(j.deviceName) : '') +
      (j.note ? '<br>备注 ' + esc(j.note) : '') +
      (j.rejectReason ? '<br><b style="color:#dc2626">驳回原因：' + esc(j.rejectReason) + '</b>' : '') +
      (j.waitReason ? '<br><b style="color:#d97706">' + esc(j.waitReason) + '</b>' : '') +
      '</div>' +
      (j.status === 'pending_audit'
        ? '<div style="margin-top:14px"><button class="ok" id="approve">通过并智能派单</button></div>' +
          '<label style="display:block;margin-top:14px">驳回原因（必填）</label>' +
          '<textarea id="reason" placeholder="说明为什么驳回，申请人可见"></textarea>' +
          '<button class="danger" id="reject">驳回</button>'
        : '') +
      (['waiting_material', 'failed', 'approved'].indexOf(j.status) >= 0
        ? '<div style="margin-top:14px"><button id="redispatch">重新智能派单</button></div>'
        : '') +
      '</div>'
    var a = $('approve')
    if (a) a.onclick = async function () {
      a.disabled = true
      var r = await api('POST', '/api/v1/farm-dispatch/job/approve', { id: j.id })
      alert(r.ok ? (r.dispatch && r.dispatch.waiting ? '已通过，但暂无匹配机，已通知巡查换料' : '已通过并派单') : (r.message || '失败'))
      await refresh()
    }
    var rj = $('reject')
    if (rj) rj.onclick = async function () {
      var reason = ($('reason').value || '').trim()
      if (!reason) return alert('请填写驳回原因')
      var r = await api('POST', '/api/v1/farm-dispatch/job/reject', { id: j.id, reason: reason })
      alert(r.ok ? '已驳回' : (r.message || '失败'))
      await refresh()
    }
    var rd = $('redispatch')
    if (rd) rd.onclick = async function () {
      var r = await api('POST', '/api/v1/farm-dispatch/job/redispatch', { id: j.id })
      alert(r.ok ? '已触发重新派单' : (r.message || '失败'))
      await refresh()
    }
  }

  async function refresh() {
    var j = await api('GET', '/api/v1/farm-dispatch/jobs?limit=200')
    if (!j || !j.ok) { alert((j && j.message) || '加载失败'); return }
    state.jobs = j.jobs || []
    if (state.selected) {
      state.selected = state.jobs.find(function (x) { return x.id === state.selected.id }) || null
    }
    render()
  }

  async function boot() {
    if (!token()) return renderLogin()
    var me = await api('GET', '/api/v1/farm-dispatch/me')
    if (!me || !me.ok || !me.roles || !me.roles.audit) { setToken(''); return renderLogin() }
    state.me = me
    await refresh()
  }
  boot()
})()
  </script>
</body>
</html>
