<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>提交打印 · 农场派单</title>
  <style>
    :root {
      --bg: #f7f5f1; --card: #fff; --line: #e4ddd2; --text: #1f1a14;
      --muted: #7a6f62; --acc: #c45c26; --ok: #2f7d4a; --err: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Iowan Old Style", "Songti SC", "Noto Serif SC", Georgia, serif;
      background:
        radial-gradient(900px 400px at 10% -10%, #f0e2d2 0%, transparent 60%),
        var(--bg);
      color: var(--text); min-height: 100vh;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 60px; }
    h1 { font-size: 1.75rem; margin: 0 0 6px; letter-spacing: -0.03em; }
    .sub { color: var(--muted); margin-bottom: 22px; font-family: "PingFang SC", sans-serif; font-size: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 4px;
      padding: 20px; margin-bottom: 14px;
    }
    label { display: block; font-family: "PingFang SC", sans-serif; font-size: 13px; color: var(--muted); margin-top: 8px; }
    input, select, textarea {
      width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 4px;
      font-size: 15px; margin-top: 6px; font-family: "PingFang SC", sans-serif; background: #fff;
    }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
    button {
      appearance: none; border: 0; border-radius: 4px; padding: 11px 16px;
      background: var(--acc); color: #fff; font-weight: 650; cursor: pointer;
      font-family: "PingFang SC", sans-serif; font-size: 14px;
    }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .meta { font-family: "PingFang SC", sans-serif; font-size: 13px; color: var(--muted); line-height: 1.5; }
    .filebox {
      border: 1px dashed #cbbba8; padding: 18px; text-align: center; border-radius: 4px;
      background: #fcfaf7; cursor: pointer; font-family: "PingFang SC", sans-serif;
    }
    .login { max-width: 420px; margin: 12vh auto; }
    .badge {
      display: inline-block; font-family: "PingFang SC", sans-serif; font-size: 12px;
      padding: 2px 8px; border-radius: 999px; background: #f3ebe3;
    }
    .rej { color: var(--err); }
    .swatch { width: 18px; height: 18px; border-radius: 50%; border: 1px solid #ccc; display: inline-block; vertical-align: middle; }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <script>
(function () {
  var TOKEN_KEY = 'farm_dispatch_jwt_submit'

  function $(id) { return document.getElementById(id) }
  function token() { return localStorage.getItem(TOKEN_KEY) || '' }
  function setToken(t) { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY) }
  function unwrap(j) {
    if (j && j.data && typeof j.data === 'object' && (j.ok === true || j.data.ok != null || j.data.jobs || j.data.roles || j.data.models)) return j.data
    return j
  }
  async function api(method, path, body) {
    var headers = { Accept: 'application/json' }
    if (token()) headers.Authorization = 'Bearer ' + token()
    if (body != null) headers['Content-Type'] = 'application/json'
    var res = await fetch(path, { method: method, headers: headers, body: body != null ? JSON.stringify(body) : undefined })
    return unwrap(await res.json().catch(function () { return { ok: false } }))
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }
  function statusText(s) {
    return ({
      pending_audit: '待审核',
      approved: '已通过',
      waiting_material: '等巡查换料',
      printing: '已派打',
      rejected: '已驳回',
      failed: '派单失败'
    })[s] || s
  }

  var state = { me: null, models: [], jobs: [], file: null, b64: '' }

  async function login(u, p) {
    var res = await fetch('/api/v1/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    })
    var j = await res.json()
    if (!j.token) throw new Error(j.message || '登录失败')
    setToken(j.token)
    var me = await api('GET', '/api/v1/farm-dispatch/me')
    if (!me.ok || !me.roles || !me.roles.submit) {
      setToken('')
      throw new Error('该账号无「派单申请」权限，请加入对应用户组')
    }
    return me
  }

  function renderLogin() {
    $('app').innerHTML =
      '<div class="card login"><h1>提交打印</h1><div class="sub">上传机型 / 材料 / 颜色 / G-code，等待审核派单</div>' +
      '<label>账号</label><input id="u" /><label>密码</label><input id="p" type="password" />' +
      '<button id="go" style="width:100%;margin-top:8px">登录</button></div>'
    $('go').onclick = async function () {
      try {
        state.me = await login($('u').value.trim(), $('p').value)
        await bootApp()
      } catch (e) { alert(e.message || e) }
    }
  }

  function render() {
    if (!state.me) return renderLogin()
    var modelOpts = ['<option value="">选择或下方手填</option>'].concat(
      state.models.map(function (m) { return '<option value="' + esc(m) + '">' + esc(m) + '</option>' })
    ).join('')
    $('app').innerHTML =
      '<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">' +
      '<div><h1>发送打印文件</h1><div class="sub">' +
      esc(state.me.user.displayName || state.me.user.username) +
      ' · 审核通过后自动匹配同机型同材料同颜色且已绑耗材的空闲机</div></div>' +
      '<button class="ghost" id="out">退出</button></div>' +
      '<div class="card"><h2 style="margin:0 0 12px;font-size:1.05rem;font-family:PingFang SC,sans-serif">新建申请</h2>' +
      '<div class="grid2"><div><label>机型（下拉）</label><select id="modelSel">' + modelOpts + '</select></div>' +
      '<div><label>机型（手填，优先）</label><input id="model" placeholder="如 X1C / P1S / K1" /></div></div>' +
      '<div class="grid2"><div><label>材料</label><input id="material" placeholder="如 PLA / PETG / ABS" /></div>' +
      '<div><label>颜色名称</label><input id="color" placeholder="如 黑色 / 白色" /></div></div>' +
      '<label>颜色色值（可选）</label><div style="display:flex;gap:10px;align-items:center">' +
      '<input id="colorHex" placeholder="#000000" style="flex:1" />' +
      '<input id="colorPick" type="color" value="#000000" style="width:48px;height:40px;padding:2px" />' +
      '<span class="swatch" id="sw"></span></div>' +
      '<label>备注</label><input id="note" placeholder="选填" />' +
      '<label>打印文件</label>' +
      '<div class="filebox" id="drop">点击或拖入 .gcode / .gco / .bgcode<div class="meta" id="fname" style="margin-top:8px">未选择文件</div></div>' +
      '<input id="file" type="file" accept=".gcode,.gco,.g,.bgcode" hidden />' +
      '<button id="submit" style="width:100%;margin-top:16px">提交审核</button></div>' +
      '<div class="card"><h2 style="margin:0 0 12px;font-size:1.05rem;font-family:PingFang SC,sans-serif">我的申请</h2><div id="mine"></div></div>'

    $('out').onclick = function () { setToken(''); state.me = null; renderLogin() }
    $('colorPick').oninput = function () {
      $('colorHex').value = $('colorPick').value
      $('sw').style.background = $('colorPick').value
    }
    $('colorHex').oninput = function () { $('sw').style.background = $('colorHex').value || '#ccc' }
    $('modelSel').onchange = function () { if (!$('model').value) $('model').value = $('modelSel').value }
    var drop = $('drop')
    drop.onclick = function () { $('file').click() }
    drop.ondragover = function (e) { e.preventDefault() }
    drop.ondrop = function (e) {
      e.preventDefault()
      if (e.dataTransfer.files && e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0])
    }
    $('file').onchange = function () {
      if ($('file').files && $('file').files[0]) readFile($('file').files[0])
    }
    $('submit').onclick = submitJob
    renderMine()
  }

  function readFile(f) {
    state.file = f
    $('fname').textContent = f.name + ' · ' + Math.round(f.size / 1024) + ' KB'
    var reader = new FileReader()
    reader.onload = function () {
      var r = String(reader.result || '')
      var i = r.indexOf('base64,')
      state.b64 = i >= 0 ? r.slice(i + 7) : ''
    }
    reader.readAsDataURL(f)
  }

  async function submitJob() {
    var model = ($('model').value || $('modelSel').value || '').trim()
    var material = ($('material').value || '').trim()
    var color = ($('color').value || '').trim()
    var colorHex = ($('colorHex').value || '').trim()
    if (!model || !material || !(color || colorHex)) return alert('请填写机型、材料、颜色')
    if (!state.b64) return alert('请上传打印文件')
    var btn = $('submit')
    btn.disabled = true
    var j = await api('POST', '/api/v1/farm-dispatch/jobs', {
      model: model,
      material: material,
      color: color,
      colorHex: colorHex,
      filename: state.file ? state.file.name : 'job.gcode',
      contentBase64: state.b64,
      note: ($('note').value || '').trim()
    })
    btn.disabled = false
    if (!j || !j.ok) return alert((j && j.message) || '提交失败')
    alert('已提交，等待审核')
    state.file = null
    state.b64 = ''
    await loadJobs()
    render()
  }

  function renderMine() {
    var el = $('mine')
    if (!state.jobs.length) { el.innerHTML = '<div class="meta">暂无申请</div>'; return }
    el.innerHTML = state.jobs.map(function (j) {
      return '<div style="border-top:1px solid var(--line);padding:12px 0">' +
        '<div><b>' + esc(j.filename) + '</b> <span class="badge">' + statusText(j.status) + '</span></div>' +
        '<div class="meta">' + esc(j.model) + ' · ' + esc(j.material) + ' · ' + esc(j.color || j.colorHex) +
        ' · ' + esc(j.createdAt) +
        (j.rejectReason ? '<div class="rej">驳回原因：' + esc(j.rejectReason) + '</div>' : '') +
        (j.waitReason ? '<div>' + esc(j.waitReason) + '</div>' : '') +
        (j.deviceName ? '<div>设备：' + esc(j.deviceName) + '</div>' : '') +
        '</div></div>'
    }).join('')
  }

  async function loadJobs() {
    var j = await api('GET', '/api/v1/farm-dispatch/jobs?mine=1&limit=50')
    state.jobs = (j && j.jobs) || []
  }

  async function bootApp() {
    var m = await api('GET', '/api/v1/farm-dispatch/models')
    state.models = (m && m.models) || []
    await loadJobs()
    render()
  }

  async function boot() {
    if (!token()) return renderLogin()
    var me = await api('GET', '/api/v1/farm-dispatch/me')
    if (!me || !me.ok || !me.roles || !me.roles.submit) { setToken(''); return renderLogin() }
    state.me = me
    await bootApp()
  }
  boot()
})()
  </script>
</body>
</html>
