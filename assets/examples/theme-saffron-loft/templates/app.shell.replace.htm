<!--{include common/header}-->
<div class="sl-world">
  <div class="sl-ambient" aria-hidden="true">
    <span class="sl-orb sl-orb-a"></span>
    <span class="sl-orb sl-orb-b"></span>
    <span class="sl-orb sl-orb-c"></span>
    <span class="sl-grain"></span>
  </div>

  <header class="sl-top">
    <div class="sl-brand-pill" data-hanye-mount="header-brand"></div>
    <div class="sl-ticker">
      <span class="sl-ticker-live">LIVE</span>
      <span class="sl-ticker-text" data-sl-ticker>工坊机位就绪 · 票券式监控</span>
      <strong class="sl-clock" data-sl-clock>—:—:—</strong>
    </div>
    <div class="sl-actions" data-hanye-mount="header-actions"></div>
  </header>

  <div class="sl-mobile" data-hanye-mount="mobile-toolbar"></div>

  <section class="sl-stage">
    <div class="sl-stage-cap">
      <div>
        <div class="sl-kicker" data-sl-kicker>NOW</div>
        <h2 class="sl-stage-title" data-sl-title>当前位置</h2>
      </div>
      <div class="sl-stage-meta">
        <span data-sl-meta><em data-sl-count>0</em> 台在册</span>
        <span class="sl-pulse" aria-hidden="true"></span>
      </div>
    </div>
    <main class="sl-main" data-hanye-mount="main"></main>
  </section>

  <nav class="sl-dock" aria-label="主导航">
    <div class="sl-dock-inner" data-hanye-mount="nav"></div>
  </nav>

  <footer class="sl-footer">
    <div data-hanye-mount="footer"></div>
    <!--{include common/footer}-->
  </footer>
</div>
