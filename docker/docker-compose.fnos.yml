# 飞牛 / 群晖 / NAS 推荐编排（与默认 compose 同一套网络，稳定连库）
# 用法（在 docker/ 目录）：
#   docker compose -f docker-compose.fnos.yml up -d --build
#
# 说明：
# - 不要用 network_mode: host 连库（飞牛上等常见「等 127.0.0.1:3306 超时」）
# - MySQL 与 app 走 Compose 默认桥接网，MYSQL_HOST=mysql
# - 局域网扫打印机：填好 LAN_SCAN_SUBNETS；仍扫不到就在网页里手动加 IP
services:
  mysql:
    image: mysql:8.0
    container_name: hanye-mysql
    restart: unless-stopped
    networks:
      default:
        aliases:
          - mysql
          - hanye-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hanye_root_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hanye_printer}
      MYSQL_USER: ${MYSQL_USER:-hanye}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hanye_pass_change_me}
    volumes:
      - hanye_mysql_data:/var/lib/mysql
      - ../ops/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-hanye_root_change_me}"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: hanye-printer-monitor:latest
    pull_policy: build
    container_name: hanye-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${PORT:-17890}:17890"
    environment:
      USE_MYSQL: "1"
      PORT: "17890"
      DATA_ROOT: /app/data
      MYSQL_HOST: hanye-mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-hanye}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hanye_pass_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hanye_printer}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:-change-me-to-a-long-random-string}
      AUTO_IMPORT: ${AUTO_IMPORT:-1}
      IMPORT_FORCE: ${IMPORT_FORCE:-0}
      WAIT_MYSQL_SECONDS: ${WAIT_MYSQL_SECONDS:-120}
      LAN_SCAN_SUBNETS: ${LAN_SCAN_SUBNETS:-192.168.1}
      RUNNING_IN_DOCKER: "1"
      UPDATE_GIT_ROOT: /host-repo
      MARKET_BASE_URL: ${MARKET_BASE_URL:-http://124.221.92.32:3001}
      MARKET_DESKTOP_SECRET: ${MARKET_DESKTOP_SECRET:-app-market-desktop-please-change-me}
      MARKET_DEVICE_ID: ${MARKET_DEVICE_ID:-}
      LICENSE_REQUIRED: ${LICENSE_REQUIRED:-0}
      LICENSE_SOFTWARE: ${LICENSE_SOFTWARE:-hanye-printer-monitor}
    volumes:
      - ../data:/app/data
      - ..:/host-repo
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:17890/api/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  hanye_mysql_data:
